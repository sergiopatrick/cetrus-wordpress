<!--
  Cetrus · Black November 2026 · barra de campanha (logo abaixo do menu, em todas as paginas).
  Conteudo de UM widget HTML do Elementor, no modelo "[BLACK-2026] #34626 Barra de campanha"
  (producao: 35965, widget addad97), que o clone do header usa no lugar da faixa sazonal (template 34626).
  Referencia: Artifact, componente "BARRA DE CAMPANHA" (Home, Busca, Produto, Material).

  v3 (23/11 a tarde, pedido do usuario, publicada na producao): o widget tem DUAS barras e o CSS
  escolhe pela classe do body (sem piscar, sem depender do script):

  1) .cbn-barra = v2 aprovada de manha, IGUAL, fora das paginas de curso (Home, vitrine, conteudos...):
     "BLACK NOVEMBER" na pilula da faixa Lista VIP (BLACK Medium com gradiente + NOVEMBER Light) |
     "Condições exclusivas até 30 de novembro" | VER CURSOS -> /vitrine/ (sem UTM).
     Celular: pilula em cima, texto embaixo, botao a direita.

  2) .cbu = so em body.single-product (paginas de curso): pilula BLACK NOVEMBER | "ÚLTIMAS VAGAS com
     condições exclusivas" | cronometro DD:HH:MM:SS igual ao da barra da Home (home-barra-cronometro.html,
     ate 01/12/2026 00:00 -03; no fim a barra some) | VER CONDIÇÃO (pilula clara do KV).
     Fundo grafite + textura + facho de luz da barra da Home. Desktop numa linha (64 px);
     ate 1023 px: tag + chamada / cronometro + botao; celular (~85 px): chamada em 2 linhas a direita.
     - "Ver condição" abre o MESMO formulario do "Quero me inscrever" do curso, com o curso ja escolhido:
       elementorProFrontend.modules.popup.showPopup({ id }) com o id lido da propria pagina
       (pos/intensivo: data-popup-inscricao-id, ex. 35981 com a Black; fellowship: data-elementor-popup-id,
       ex. 35985). O pop-up preenche o curso sozinho (courseCode) e a unidade/turma escolhidas.
       Sem id de pop-up (pacote): clica no "Quero me inscrever" da pagina, que leva ao formulario #form.
       Nenhum id fixo no codigo -> vale com a Black ligada (clones) ou desligada (originais).
     - Contagem de cadastros: o formulario aberto pela barra recebe "barra-black-ultimas-vagas" no campo
       oculto contact__gn_ab_test ("[GN] Teste A/B - Site", copiado para o negocio em deal__gn_ab_test).
       UTMs intocadas. So preenche campo vazio (as paginas -a/-b do teste A/B mantem o valor delas).
       O "Quero me inscrever" continua sem marca. Clique tambem vai para o dataLayer:
       { event: 'MM_click_barra_black', barra: 'ultimas-vagas', curso } -> GTM v232 (evento GA4).
     - 24/11: a marca vale SO para o formulario aberto pela barra. Pop-up aberto por outro caminho tem a
       marca removida (o pop-up fechado sem o X guardava o formulario ja marcado; o HubSpot pode preencher
       o campo oculto com o valor que o contato ainda tem). Pacote: clique de verdade (isTrusted) no
       "Quero me inscrever" depois da barra tira a marca do formulario #form.
     - O workflow do HubSpot "[GN] Contact - Prop: Teste A/B - Site" copia o valor para o negocio e
       APAGA o campo no contato ~30 min depois: listas/relatorios devem filtrar pelo NEGOCIO
       (lista 56093 = contatos com negocio deal__gn_ab_test = marca e data de MQL).
     - Depois de publicar mudanca neste modelo, limpar o "Cache de borda global" do WordPress.com
       (my.wordpress.com/sites/cetrus.com.br/settings/caching); senao a 1a visita de cada pagina
       recebe a versao anterior (x-ac STALE).

  - Sem porcentagem (regras de copy do Artifact).
-->
<style>
/* ===== barra atual (fora das paginas de curso): igual a v2 aprovada em 23/11 ===== */
.cbn-barra{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px 16px;width:calc(100vw - var(--cbn-sbw,0px));margin-left:calc(50% - 50vw + var(--cbn-sbw,0px) / 2);min-height:52px;padding:10px 20px;background:#0E0F12;border-bottom:1px solid rgba(255,255,255,.10);color:#F3F3F6!important;text-decoration:none!important;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.3;text-align:left;-webkit-font-smoothing:antialiased}

.cbn-barra__black,.cbn-barra__nov{display:inline-block;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cbn-barra__black{font-weight:500;background-image:linear-gradient(100deg,#7d80a8 0%,#8C8EB6 24%,#D4D5E8 72%,#f1f2f9 100%)}
.cbn-barra__nov{font-weight:300;background-image:linear-gradient(90deg,#F3F3F6 0%,#F3F3F6 55%,rgba(243,243,246,.62) 100%)}

.cbu a.cbu-a{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:18px;max-width:1218px;min-height:64px;margin:0 auto;padding:9px 24px;color:var(--cbu-txt)!important;text-decoration:none!important;cursor:pointer}

/* tag Black November (a mesma da barra atual) */
.cbu .cbu-tag{grid-area:tag;flex:none;display:inline-flex;align-items:center;gap:.42em;height:26px;padding:0 12px 0 14px;border:1px solid rgba(212,213,232,.42);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.015) 100%);font-size:11px;line-height:1;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.cbu .cbu-black,.cbu .cbu-nov{display:inline-block;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cbu .cbu-black{font-weight:500;background-image:linear-gradient(100deg,#7d80a8 0%,#8C8EB6 24%,#D4D5E8 72%,#f1f2f9 100%)}
.cbu .cbu-nov{font-weight:300;background-image:linear-gradient(90deg,#F3F3F6 0%,#F3F3F6 55%,rgba(243,243,246,.62) 100%)}

/* cronometro (mesmo desenho da Home) */

.cbu .cbu-u{display:flex;flex-direction:column;align-items:center;gap:4px}

	background-image:linear-gradient(100deg,var(--cbu-lav) 0%,var(--cbu-lav2) 55%,#f1f2f9 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

.cbu .cbu-sep{font-style:normal;font-size:20px;font-weight:300;line-height:23px;height:23px;color:rgba(140,142,182,.9)}
/* botao: pilula clara do KV (a mesma da Home) */
.cbu .cbu-btn{grid-area:btn;flex:none;display:inline-flex;align-items:center;margin-left:6px;padding:12px 18px;border-radius:4px;
	background:linear-gradient(100deg,#c9d3f1 0%,#f4f5fb 52%,#dde3f6 100%);color:#15161a;
	font-size:12px;font-weight:500;line-height:1;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
	box-shadow:0 2px 10px rgba(0,0,0,.25);transition:background .2s ease,box-shadow .2s ease}
.cbu a.cbu-a:hover .cbu-btn,.cbu a.cbu-a:focus-visible .cbu-btn{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.32)}
/* tablet: 2 linhas (tag + chamada / cronometro + botao) */
@media (max-width:1023px){
	.cbu a.cbu-a{display:grid;grid-template-columns:auto auto;grid-template-areas:"tag txt" "cd btn";justify-content:center;align-items:center;gap:10px 28px;padding:10px 24px 11px}
	.cbu .cbu-traco{display:none}
	.cbu .cbu-tag{justify-self:start}
	.cbu .cbu-txt{justify-self:end}
	.cbu .cbu-cd{margin-left:0;justify-self:start}

/* celular: tag + chamada em 2 linhas / cronometro + botao */
@media (max-width:767px){
	.cbu a.cbu-a{grid-template-columns:minmax(0,1fr) auto;justify-content:stretch;gap:7px 12px;padding:8px 14px 9px}
	.cbu .cbu-tag{height:20px;padding:0 8px 0 9px;font-size:8.5px;letter-spacing:.14em}

	.cbu a.cbu-a{gap:8px 8px;padding:9px 10px 10px}
	.cbu .cbu-tag{padding:0 7px 0 8px;font-size:8px;letter-spacing:.12em}
	.cbu .cbu-txt{font-size:9.5px;letter-spacing:.06em}

}
@media (prefers-reduced-motion:reduce){.cbu .cbu-btn{transition:none}}
</style>
<a class="cbn-barra" href="/vitrine/" aria-label="Black November: condições exclusivas até 30 de novembro. Ver cursos.">
	<span class="cbn-barra__tag"><span class="cbn-barra__black">Black</span><span class="cbn-barra__nov">November</span></span>
	<span class="cbn-barra__traco" aria-hidden="true"></span>

</a>
<div class="cbu" role="region" aria-label="Black November">

	<a class="cbu-a" href="#inscricao" role="button" aria-haspopup="dialog" data-utm-decorated="1" aria-label="Black November: últimas vagas com condições exclusivas. Ver condição deste curso (abre o formulário de inscrição).">
		<span class="cbu-tag"><span class="cbu-black">Black</span><span class="cbu-nov">November</span></span>

<script>
(function () {
	var raiz = document.documentElement;
	// largura total sem rolagem horizontal (mesmo truque da faixa sazonal)
	function sbw() { raiz.style.setProperty('--cbn-sbw', (window.innerWidth - raiz.clientWidth) + 'px'); }
	sbw(); window.addEventListener('resize', sbw); window.addEventListener('load', sbw);
	if ('ResizeObserver' in window) new ResizeObserver(sbw).observe(document.body);

	if (!document.body.classList.contains('single-product')) return;
	var barra = document.querySelector('.cbu');
	if (!barra) return;

	/* cronometro: fim da Black = 01/12/2026 00:00 em Brasilia (-03:00), o mesmo da Home */
	var FIM = Date.UTC(2026, 11, 1, 3, 0, 0);
	var campos = {};
	['d', 'h', 'm', 's'].forEach(function (k) { campos[k] = barra.querySelector('[data-cbu="' + k + '"]'); });
	function dois(n) { return (n < 10 ? '0' : '') + n; }
	function tique() {
		var falta = FIM - Date.now();
		if (falta <= 0) { barra.hidden = true; return; }
		var t = Math.floor(falta / 1000);
		campos.d.textContent = dois(Math.floor(t / 86400));
		campos.h.textContent = dois(Math.floor(t % 86400 / 3600));
		campos.m.textContent = dois(Math.floor(t % 3600 / 60));
		campos.s.textContent = dois(t % 60);
		setTimeout(tique, 1000 - (Date.now() % 1000) + 10);
	}
	tique();

	/* Ver condicao: abre o MESMO pop-up de inscricao do "Quero me inscrever" deste curso
	   (pos/intensivo = formulario HubSpot do curso; fellowship e pacote = o pop-up proprio de cada um).
	   O id vem da propria pagina, entao vale com a Black ligada (clones) e desligada (originais). */
	var fora = function (e) { return !e.closest('.cbu, .elementor-location-popup'); };
	var visivel = function (e) { var r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
	function idPopup() {
		var grupos = [
			['[data-lyceum-enrollment-form][data-popup-inscricao-id]', 'data-popup-inscricao-id'],
			['[data-lyceum-course-btn-standalone][data-popup-inscricao-id]', 'data-popup-inscricao-id'],
			['[data-lyceum-enrollment-btn][data-popup-target]', 'data-popup-target'],
			['.lyceum-fellowship-btn[data-elementor-popup-id], [data-elementor-popup-id]', 'data-elementor-popup-id']
		];
		for (var i = 0; i < grupos.length; i++) {
			var els = [].filter.call(document.querySelectorAll(grupos[i][0]), fora);
			var el = els.filter(visivel)[0] || els[0];
			var id = el ? parseInt(el.getAttribute(grupos[i][1]) || '', 10) : 0;
			if (id) return id;
		}
		return 0;
	}
	function botaoDaPagina() {
		return [].filter.call(document.querySelectorAll('[data-lyceum-enrollment-btn], .lyceum-fellowship-btn, a.elementor-button'), function (e) {
			return fora(e) && /quero me (inscrever|matricular)|inscreva-se/i.test(e.textContent);
		}).sort(function (a, b) { return visivel(b) - visivel(a); })[0] || null;
	}
	/* Contagem de cadastros: o formulario aberto PELA BARRA leva MARCA no campo oculto
	   "[GN] Teste A/B - Site" (contact__gn_ab_test), que o HubSpot copia para o negocio (deal__gn_ab_test).
	   As UTMs nao mudam. So preenche campo vazio: as paginas -a/-b do teste A/B mantem "A"/"B". */
	var MARCA = 'barra-black-ultimas-vagas';
	var pedido = { id: 0, em: 0 }, popupDaBarra = 0, alvoDaBarra = null;
	function poe(c, v) {
		var d = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(c), 'value');
		if (d && d.set) d.set.call(c, v); else c.value = v;
		c.dispatchEvent(new Event('input', { bubbles: true }));
		c.dispatchEvent(new Event('change', { bubbles: true }));
	}
	// pop-up aberto pela barra (pos, intensivo, fellowship) ou formulario na pagina (pacote: "#form")
	function raizesDaBarra() {
		return [popupDaBarra && document.querySelector('[data-elementor-id="' + popupDaBarra + '"]'), alvoDaBarra].filter(Boolean);
	}
	function marcar() {
		raizesDaBarra().forEach(function (raiz) {
			[].forEach.call(raiz.querySelectorAll('input[name="contact__gn_ab_test"]'), function (c) { if (!c.value) poe(c, MARCA); });
		});
	}
	// formulario aberto por outro caminho NAO leva a marca: o pop-up fechado sem o X guarda o formulario
	// ja marcado, e o HubSpot pode preencher o campo oculto com o valor que o contato ainda tem
	function desmarcarFora() {
		var dentro = raizesDaBarra();
		[].forEach.call(document.querySelectorAll('input[name="contact__gn_ab_test"]'), function (c) {
			if (c.value !== MARCA) return;
			for (var i = 0; i < dentro.length; i++) if (dentro[i].contains(c)) return;
			poe(c, '');
		});
	}
	function acertar() { desmarcarFora(); marcar(); }
	window.addEventListener('message', function (e) {
		var d = e.data;
		if (d && d.type === 'hsFormCallback' && (d.eventName === 'onFormReady' || d.eventName === 'onFormSubmit')) acertar();
	});
	if (window.jQuery) {
		// so conta como "da barra" o pop-up que abriu logo depois do clique nela (o "Quero me inscrever" zera)
		jQuery(document).on('elementor/popup/show', function (e, id) {
			popupDaBarra = (+id === pedido.id && Date.now() - pedido.em < 2000) ? pedido.id : 0;
			pedido.id = 0;
			acertar(); setTimeout(acertar, 1500);
		});
		jQuery(document).on('elementor/popup/hide', function () { popupDaBarra = 0; });
	}
	// pacote: clique de verdade no "Quero me inscrever" depois da barra -> o envio passa a ser do botao
	document.addEventListener('click', function (ev) {
		if (!ev.isTrusted || !alvoDaBarra) return;
		var b = ev.target && ev.target.closest ? ev.target.closest('a, button') : null;
		if (!b || b.closest('.cbu') || !/quero me (inscrever|matricular)|inscreva-se/i.test(b.textContent)) return;
		alvoDaBarra = null;
		desmarcarFora();
	}, true);

	barra.querySelector('.cbu-a').addEventListener('click', function (ev) {
		ev.preventDefault();
		var id = idPopup();
		window.dataLayer = window.dataLayer || [];
		window.dataLayer.push({ event: 'MM_click_barra_black', barra: 'ultimas-vagas', curso: typeof courseCode !== 'undefined' ? courseCode : '' });
		var mod = window.elementorProFrontend && elementorProFrontend.modules && elementorProFrontend.modules.popup;
		if (id && mod && typeof mod.showPopup === 'function') { pedido = { id: id, em: Date.now() }; mod.showPopup({ id: id }); return; }
		var b = botaoDaPagina();
		if (b) {
			// pacote: o "Quero me inscrever" leva ao formulario da propria pagina (#form) -> marca esse formulario
			var h = b.getAttribute('href') || '';
			var t = /^#[\w-]+$/.test(h) ? document.getElementById(h.slice(1)) : null;
			if (t && t.querySelector('input[name="contact__gn_ab_test"]')) { alvoDaBarra = t; marcar(); }
			b.click();
			return;
		}
		var card = document.querySelector('.course-selection');
		if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
	});
})();
</script>
