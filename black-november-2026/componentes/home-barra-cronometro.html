<script>
(function () {
	var barra = document.querySelector('.cbs');
	if (!barra) return;
	/* fim da Black: 01/12/2026 00:00 em Brasilia (-03:00) */
	var FIM = Date.UTC(2026, 11, 1, 3, 0, 0);
	var raiz = document.documentElement;

	/* Sai do container do Elementor e vira filha do body, logo depois do header: assim o sticky vale
	   para a pagina inteira (dentro do container ela so prenderia enquanto o container estivesse na tela).
	   Fica no mesmo lugar visual (o container era o primeiro da Home), entao nada pula. */
	var header = document.querySelector('[data-elementor-type="header"]');
	if (header && header.parentNode === document.body) {
		var origem = barra.closest('.e-con.e-parent');
		document.body.insertBefore(barra, header.nextSibling);
		/* o container que sobrou so tem este widget (o <style> continua valendo mesmo oculto) */
		if (origem && origem.querySelectorAll('.elementor-widget').length === 1) origem.style.display = 'none';
	}

	/* cronometro */
	var campos = {};
	['d', 'h', 'm', 's'].forEach(function (k) { campos[k] = barra.querySelector('[data-cbs="' + k + '"]'); });
	function dois(n) { return (n < 10 ? '0' : '') + n; }
	function tique() {
		var falta = FIM - Date.now();
		if (falta <= 0) { barra.hidden = true; return; }
		var t = Math.floor(falta / 1000);
		campos.d.textContent = dois(Math.floor(t / 86400));
		campos.h.textContent = dois(Math.floor(t % 86400 / 3600));
		campos.m.textContent = dois(Math.floor(t % 3600 / 60));
		campos.s.textContent = dois(t % 60);
		setTimeout(tique, 1000 - (Date.now() % 1000) + 10);
	}
	tique();
	if (barra.hidden) return;

	/* prende logo abaixo do menu fixo do Elementor (desktop e celular tem menus diferentes) */
	var agendado = false;
	function medir() {
		agendado = false;
		var topo = 0;
		if (header) {
			[].forEach.call(header.querySelectorAll('.elementor-sticky--active'), function (e) {
				if (getComputedStyle(e).position !== 'fixed') return;
				var r = e.getBoundingClientRect();
				if (r.height > 0 && r.top <= 1) topo = Math.max(topo, r.bottom);
			});
		}
		raiz.style.setProperty('--cbs-topo', Math.round(topo) + 'px');
		barra.classList.toggle('cbs--presa', window.pageYOffset > 0 && barra.getBoundingClientRect().top <= topo + 1);
	}
	function agendar() { if (!agendado) { agendado = true; (window.requestAnimationFrame || setTimeout)(medir); } }
	medir();
	window.addEventListener('scroll', agendar, { passive: true });
	window.addEventListener('resize', agendar);
	window.addEventListener('load', agendar);
	/* o sticky do Elementor so liga depois que o script dele roda */
	setTimeout(agendar, 300); setTimeout(agendar, 1500);
})();
</script>
