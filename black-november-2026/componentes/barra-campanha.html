<!--
  Cetrus · Black November 2026 · barra de campanha (logo abaixo do menu, em todas as paginas).
  Conteudo de UM widget HTML do Elementor, no modelo "[BLACK-2026] #34626 Barra de campanha"
  (producao: 35965, widget addad97), que o clone do header usa no lugar da faixa sazonal (template 34626).
  Referencia: Artifact, componente "BARRA DE CAMPANHA" (Home, Busca, Produto, Material).

  v2 (23/11, aprovada e publicada na producao): "BLACK NOVEMBER" na mesma pilula da faixa Lista VIP
  (BLACK Medium com gradiente + NOVEMBER Light) | "Condições exclusivas até 30 de novembro" | VER CURSOS.

  - Um link so (sem link dentro de link), largura total, mesma altura em todas as paginas.
  - Nas paginas de curso o CTA vira "Ver condição" e rola ate o card de inscricao
    (seletor de unidade/turma); nas demais leva para /vitrine/ (sem UTM).
  - Curso sem seletor de turma (fellowship, Sanar Pos, EAD, pacote, graduacao; 02/11): rola ate o
    primeiro "Quero me inscrever/matricular" do conteudo (ou ate o destino dele, se for ancora, como
    o #form do pacote); se o botao so existir no header ou numa barra fixa, abre o mesmo formulario.
  - Celular: pilula em cima, texto embaixo, botao a direita. Home no celular sem a barra (cenario B, 04/11).
  - Sem porcentagem (regras de copy do Artifact). O cronometro fica na barra da Home (home-barra-cronometro.html).
-->
<style>
.cbn-barra{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px 16px;width:calc(100vw - var(--cbn-sbw,0px));margin-left:calc(50% - 50vw + var(--cbn-sbw,0px) / 2);min-height:52px;padding:10px 20px;background:#0E0F12;border-bottom:1px solid rgba(255,255,255,.10);color:#F3F3F6!important;text-decoration:none!important;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.3;text-align:left;-webkit-font-smoothing:antialiased}
.cbn-barra *{box-sizing:border-box}
.cbn-barra__tag{flex:none;display:inline-flex;align-items:center;gap:.42em;height:26px;padding:0 12px 0 14px;border:1px solid rgba(212,213,232,.42);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.015) 100%);font-family:"BwModelica","Bw Modelica",Montserrat,sans-serif;font-size:11px;line-height:1;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.cbn-barra__black,.cbn-barra__nov{display:inline-block;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cbn-barra__black{font-weight:500;background-image:linear-gradient(100deg,#7d80a8 0%,#8C8EB6 24%,#D4D5E8 72%,#f1f2f9 100%)}
.cbn-barra__nov{font-weight:300;background-image:linear-gradient(90deg,#F3F3F6 0%,#F3F3F6 55%,rgba(243,243,246,.62) 100%)}
.cbn-barra__traco{flex:none;width:1px;height:20px;background:rgba(255,255,255,.22)}
.cbn-barra__txt{color:rgba(243,243,246,.88)}
.cbn-barra__cta{flex:none;display:inline-flex;align-items:center;padding:6px 14px;border:1px solid rgba(255,255,255,.45);border-radius:4px;font-family:"BwModelica","Bw Modelica",Montserrat,sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;white-space:nowrap;transition:background .2s}
.cbn-barra:hover .cbn-barra__cta,.cbn-barra:focus-visible .cbn-barra__cta{background:rgba(255,255,255,.08)}
.cbn-barra:focus-visible{outline:2px solid #D4D5E8;outline-offset:-2px}
/* celular: pilula em cima, texto embaixo, botao a direita (2 linhas) */
@media (max-width:767px){
	.cbn-barra{display:grid;grid-template-columns:minmax(0,max-content) auto;grid-template-areas:"tag cta" "txt cta";justify-content:center;align-items:center;gap:6px 14px;padding:9px 16px 10px;font-size:13px}
	.cbn-barra__tag{grid-area:tag;justify-self:start;height:20px;padding:0 8px 0 9px;font-size:8.5px;letter-spacing:.14em}
	.cbn-barra__traco{display:none}
	.cbn-barra__txt{grid-area:txt;font-size:12.5px}
	.cbn-barra__cta{grid-area:cta;padding:8px 11px;font-size:10.5px;letter-spacing:.1em}
}
@media (max-width:359px){.cbn-barra{padding-left:12px;padding-right:12px;gap:6px 10px}.cbn-barra__txt{font-size:11.5px}.cbn-barra__cta{padding:8px 9px;font-size:10px;letter-spacing:.08em}}
/* Home no celular (04/11, cenario B escolhido pelo Paulo e pela Linei): sem a barra. A regra fica aqui, antes do HTML
   da barra, para ela nunca aparecer e sumir (CLS). */
@media (max-width:767px){body.home .elementor-widget-template:has(.cbn-barra){display:none}}
</style>
<a class="cbn-barra" href="/vitrine/" aria-label="Black November: condições exclusivas até 30 de novembro. Ver cursos.">
	<span class="cbn-barra__tag"><span class="cbn-barra__black">Black</span><span class="cbn-barra__nov">November</span></span>
	<span class="cbn-barra__traco" aria-hidden="true"></span>
	<span class="cbn-barra__txt">Condições exclusivas até 30 de novembro</span>
	<span class="cbn-barra__cta">Ver cursos</span>
</a>
<script>
(function () {
	var barra = document.querySelector('.cbn-barra');
	if (!barra) return;
	// largura total sem rolagem horizontal (mesmo truque da faixa sazonal)
	function sbw() { document.documentElement.style.setProperty('--cbn-sbw', (window.innerWidth - document.documentElement.clientWidth) + 'px'); }
	// a barra de rolagem so existe depois que a pagina cresce: medir de novo no load e a cada mudanca de tamanho
	sbw(); window.addEventListener('resize', sbw); window.addEventListener('load', sbw);
	if ('ResizeObserver' in window) new ResizeObserver(sbw).observe(document.body);
	// pagina de curso: "Ver condição" leva ao card de inscricao
	if (document.body.classList.contains('single-product')) {
		// o template tem um card para desktop e outro para mobile: usa o que estiver visivel
		var alvo = function () {
			var c = [].slice.call(document.querySelectorAll('.course-selection, .unit-select'));
			return c.filter(function (e) { return e.offsetParent !== null; })[0] || null;
		};
		barra.querySelector('.cbn-barra__cta').textContent = 'Ver condição';
		barra.setAttribute('aria-label', 'Black November: condições exclusivas até 30 de novembro. Ver condição deste curso.');
		barra.setAttribute('href', '#inscricao');
		// sem seletor de turma: o botao de inscricao da pagina
		var botoes = function () {
			return [].slice.call(document.querySelectorAll('a.elementor-button, button.elementor-button, a.lyceum-course-btn')).filter(function (e) {
				return e.offsetParent !== null && /quero me (inscrever|matricular)|inscreva-se/i.test(e.textContent) && !e.closest('.cbn-barra, .elementor-location-popup');
			});
		};
		// botao no header ou numa barra fixa (o "Quero me inscrever" do rodape no celular) nao tem para onde rolar: abre
		var noConteudo = function (e) {
			if (e.closest('[data-elementor-type="header"], [data-elementor-type="footer"]')) return false;
			for (var x = e; x && x !== document.body; x = x.parentElement) if (getComputedStyle(x).position === 'fixed') return false;
			return true;
		};
		barra.addEventListener('click', function (ev) {
			var a = alvo();
			if (a) {
				ev.preventDefault();
				a.scrollIntoView({ behavior: 'smooth', block: 'center' });
				return;
			}
			var b = botoes(), c = b.filter(noConteudo)[0];
			if (c) {
				var h = c.getAttribute('href') || '';
				var destino = /^#[\w-]+$/.test(h) ? document.getElementById(h.slice(1)) : null;
				ev.preventDefault();
				(destino && destino.offsetParent !== null ? destino : c).scrollIntoView({ behavior: 'smooth', block: 'center' });
			} else if (b[0]) {
				ev.preventDefault();
				b[0].click();
			}
		});
	}
})();
</script>
