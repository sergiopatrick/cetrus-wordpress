<style>
.cbh{--ft:"BwModelica","Bw Modelica",Montserrat,sans-serif;position:relative;overflow:hidden;min-height:600px;background:#0B0C0E;color:#F3F3F6;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;display:flex}

.cbh__fotos{position:absolute;top:0;right:0;bottom:0;width:58%;background:#191A1E}
.cbh__fotos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:0;transition:opacity 1.2s ease}
.cbh__fotos img.is-ativa{opacity:1}

.cbh__black{margin:0;font-family:var(--ft);font-size:64px;line-height:1;letter-spacing:.02em;white-space:nowrap;color:#F3F3F6}
.cbh__black strong{font-weight:700;background:linear-gradient(100deg,#8C8EB6 0%,#D4D5E8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cbh__black span{font-weight:300}
.cbh__h1{max-width:660px;margin:-8px 0 0;font-family:var(--ft);font-size:clamp(22px,2.2vw,30px);font-weight:300;line-height:1.3;color:rgba(243,243,246,.92)}
.cbh__h1 strong{font-weight:700;color:#fff}
.cbh__ctas{display:flex;flex-wrap:wrap;gap:12px}
.cbh__btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border-radius:4px;font-family:var(--ft);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none!important;white-space:nowrap;transition:background .2s,color .2s}
.cbh__btn--claro{background:#F3F3F6;color:#111214!important}

.cbh__busca input{flex:1 1 auto;min-width:0;min-height:46px;padding:0 14px;background:transparent!important;border:0!important;color:#F3F3F6!important;font:inherit;font-size:15px;box-shadow:none!important}

.cbh__busca button{min-height:46px;padding:0 20px;border:0;border-radius:6px;background:#F3F3F6!important;color:#111214!important;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.cbh__prof{position:absolute;right:max(20px,calc((100vw - 1240px) / 2 + 20px));bottom:32px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:380px}
.cbh__nome{margin:0;text-align:right;font-size:13px;line-height:1.45;color:rgba(243,243,246,.8)}
.cbh__nome strong{display:block;font-family:var(--ft);font-size:15px;font-weight:600;color:#fff}
.cbh__nome span{display:block}
.cbh__barras{display:flex;margin-right:-4px}
.cbh__barras button{width:36px;height:44px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cbh__barras span{display:block;width:28px;height:3px;border-radius:2px;background:rgba(243,243,246,.32);transition:background .4s}

</style>
<script>
(function () {
	var raiz = document.querySelector('.cbh');
	if (!raiz) return;
	var profs = [
		{ nome: 'Dr. Fábio Peralta', esp: 'Medicina Fetal', cred: 'King’s College Hospital' },
		{ nome: 'Dr. Mateus Queiroz', esp: 'Ultrassonografia Musculoesquelética', cred: 'Membro titular do Colégio Brasileiro de Radiologia' },
		{ nome: 'Dra. Daniella Prudente', esp: 'Imagem da Mama', cred: 'Head do serviço de imagem do Instituto de Radiodiagnóstico da Bahia' },
		{ nome: 'Dr. Feres Chaddad', esp: 'Microcirurgia Neurológica', cred: 'CRM 89100/SP · RQE 69760' }
	];
	var fotos = raiz.querySelectorAll('.cbh__fotos img');
	var botoes = raiz.querySelectorAll('.cbh__barras button');
	var nome = raiz.querySelector('.cbh__nome');
	var atual = 0, timer = null;
	function mostra(i) {
		atual = i;
		fotos.forEach(function (f, k) { f.classList.toggle('is-ativa', k === i); if (k === i && f.loading === 'lazy') f.loading = 'eager'; });
		botoes.forEach(function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
		nome.innerHTML = '<strong></strong><span class="cbh__esp"></span><span class="cbh__cred"></span>';
		nome.querySelector('strong').textContent = profs[i].nome;
		nome.querySelector('.cbh__esp').textContent = profs[i].esp;
		nome.querySelector('.cbh__cred').textContent = profs[i].cred;
	}
	botoes.forEach(function (b, k) { b.addEventListener('click', function () { mostra(k); reinicia(); }); });
	var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	function reinicia() { clearInterval(timer); if (!reduz) timer = setInterval(function () { mostra((atual + 1) % profs.length); }, 5000); }
	reinicia();
})();
</script>
